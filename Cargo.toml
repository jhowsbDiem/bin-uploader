[package]
name = "bin-uploader"
version = "0.1.0"
edition = "2024"
description = "Finds the latest ESP32 build of an Arduino sketch and flashes it with esptool"
license = "MIT"
repository = "https://github.com/jhowsbDiem/bin-uploader"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
md5 = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
